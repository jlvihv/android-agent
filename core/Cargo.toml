[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "android-agent 核心：HTTP/SSE/WS 服务 + agent loop + LLM 接入"

[lib]
name = "agent_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "agent-dev"
path = "src/main.rs"

# 生成 Kotlin 绑定用。放在 feature 后面，这样默认构建不会把
# uniffi_bindgen（含 askama 模板）编进来。
#   cargo run --features uniffi-bindgen --bin uniffi-bindgen -- \
#     generate --library target/debug/libagent_core.so \
#     --language kotlin --out-dir ../android/app/src/main/java
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# 不加这行的话，默认构建会尝试编译这个 bin 并因为缺 `cli` feature 而失败
required-features = ["uniffi-bindgen"]

[features]
uniffi-bindgen = ["uniffi/cli"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util", "fs"] }
tokio-stream = "0.1"
# 沙箱文件按块流式返回（音视频、大文件），不整个读进内存
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
# features = ["log"]：把 tracing 的事件也发给 `log` crate。
# **安卓上必须有它** —— 那边只装 android_logger（log 的 sink），没装 tracing
# subscriber，所以没有这座桥的话，我们所有的 tracing::info!（缓存命中率、
# 装工具的进度、沙箱告警）在 logcat 里**全部看不到**。桌面装了 fmt subscriber，
# 而系统里没有别的 log logger，所以不会重复打。
tracing = { version = "0.1", features = ["log"] }
thiserror = "2"
anyhow = "1"
http = "1"

# 自己造 reqwest client，绕开 rustls-platform-verifier（R9）。
# Android 上后者要求先 init_with_env(env, context)，否则第一次请求就 panic。
# 见 src/llm.rs 的 tls_config() 说明。
#
# rustls-no-provider 而不是 rustls：后者硬编码 aws-lc-rs（AWS-LC 是个大 C 库）。
# crypto provider 由我们自己的 rustls 依赖选（ring，更小）。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
# ring 而不是 aws-lc-rs：体积小不少（aws-lc 是个完整的 C 库）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"

# `read` 工具读图片：解码 → 按 EXIF 转正 → 缩到 2000×2000 → 重编码。
# 移植 OpenMinis 的 ImageReader.kt（那边用 Android BitmapFactory，这边纯 Rust）。
# default-features = false：不要 rayon，也别把 avif/exr/tiff 那些拖进 Android 包。
#
# 解码只留 png / jpeg / webp（2026-10-13 去掉 gif / bmp）：
#   - 手机相册和截图实测就这三种（相机 jpeg、屏幕 png、Google 相册存的 webp）
#   - gif / bmp 两个解码器在 .text 里占 ~90KB（cargo bloat）
#   - 收到这两种格式不是“静默不支持”：`imaging` 会带着一句人话 400（见
#     `upload_attachment` 的 Err 分支），界面把原因原样显示出来
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# 图片以 data URL 发出，直接 base64
base64 = "0.22"

# 会话持久化。bundled = 把 SQLite 源码一起编进来，不依赖系统库
# （Android 上根本没有 libsqlite3.so 可链）。
# 为什么不是 JSON 文件：追加一条消息要全量重写，流式输出时就是每秒
# 上兆的闪存写入。SQLite 追加是 O(新增)。
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# 杀命令的**进程组**（`kill(-pgid, …)`）。tokio 的 `Child` 只能杀 proot 自己，
# 而 guest 进程是独立的宿主进程 —— 见 linux.rs 的 `CommandGuard`。
# （宿主模式也走它：那边没有 proot，但「命令自己的进程组」是同一个形状。）
libc = "0.2"
# 决策 D2：正向绑定 + 反向 callback，不手写 JNI
uniffi = { version = "0.32", features = ["tokio"] }

# log 由 tracing 的 log feature 和 android_logger 一起用；panic hook 在安卓上
# 也走它（Rust 默认把 panic 打到 stderr，而安卓上 stderr 是丢掉的）
log = "0.4"

# 只桌面用（安卓走 tracing 的 log feature → android_logger）。
# 放这里而不是普通依赖：否则 env-filter 会把 regex-automata/regex-syntax
# 编进安卓的 .so（实测 ~0.2MB）。
# 中继（出门在外连家里的电脑，见 docs/12-relay.md）：握手协议和中继服务器在
# `relay/` 那个小 crate 里，两头共用同一份。
agent-relay = { path = "../relay" }
# 手机 ↔ 家里电脑之间的端到端 TLS（中继只搬加密后的字节）。ring 而不是 aws-lc，
# 和上面的 rustls 同一个 provider。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
# 每条连接自己服务（`http::serve_conn`）：明文 / 局域网 TLS / 中继三种连接走同一个
# 函数。这几个本来就经 axum 编进来了（axum::serve 底下就是它们），这里只是变成直接依赖。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 桌面浏览器后端（`cdp.rs`）：CDP 就是 WebSocket + JSON，自己写客户端。
# 用**同步**那个（tokio-tungstenite 依赖的），因为 `BrowserApi::execute` 本来就
# 是阻塞接口、跑在 spawn_blocking 上。**不引新代码** —— 同一个版本早就在依赖树里
# 了（axum 带进来的），这里只是把它变成直接依赖。
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "url"] }
# 「家里那台」的自签证书（`remote.rs`）。只有电脑会当家里那台，手机不需要。
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[target.'cfg(target_os = "android")'.dependencies]
# default-features = false：它的默认 feature 是 "regex"（env_filter，给
# `with_filter` 用的）。我们只用 with_max_level/with_tag，关掉它就不会把
# regex-automata/regex-syntax 编进 .so。
android_logger = { version = "0.14", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
# **panic 就崩**，不兜。
#
# 一整套理由都指向它：
#
# - 兜 panic 等于让库把它**悄悄吞掉**：tokio 里任务默默死掉、uniffi 把它翻成
#   一句没头没尾的异常，前端看到的只是「流断在半路 / 一句话都没有」。实测
#   踩过（`/api/chat` 只发出 start/start-step 就没了），根因在 stderr 里，
#   而安卓的 stderr 是丢掉的 —— 那种失败比崩溃难查得多。
# - 我们自己的代码基本不 panic：生产代码里只有 6 处 unwrap/expect，且都是
#   内部不变量（`find(|s| s.id == id).unwrap()` 这种刚查过就取）。会 panic
#   就是 bug，就该崩出来。
# - 第三方解码器（image / zune_jpeg / png）的**解码 API 本来就是 `Result`**，
#   畸形输入走 `Err`；真 panic 是它们的 bug —— 那就修 / 换 / 自己写，
#   不要盖毯子（曾为这个加过一层 `catch_unwind`，已去掉，见 imaging.rs）。
#
# 副作用（都是想要的）：`catch_unwind` 全部失效、`Mutex` 中毒从此不可能、
# 栈回溯不用留 —— `.eh_frame` / `.eh_frame_hdr` / `.gcc_except_table` 连同
# 一堆清理代码全省掉。实测 `.so` 7.78MB → 6.72MB，打进 APK 少 ~388KB。
#
# 注意：`cargo test` 走 dev profile（unwind），**运行时行为测不到** ——
# 别以为测试过了就等于 release 也会 abort。`lib.rs` 里有一个测试专门
# 盯着这一行配置，防止它被无声改回去。
panic = "abort"
