<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <!-- dark 在前：没偏好的环境（老 WebView）拿到的就是深色，和 app.css 里
         `@theme` 那份默认一致。有偏好的照样跟随系统（浅色在那边的
         `@media (prefers-color-scheme: light)` 里）。 -->
    <meta name="color-scheme" content="dark light" />
    <!-- 站点图标 = App 图标那个机器人（图形源在 android/app/icon-src/）。
         SVG 一份给认得的浏览器，PNG 两份兜底：32 是标签页/书签，180 是
         iOS 加到主屏（电脑上连核心时用 Safari 的话）。手机上 WebView 不看这些，
         桌面图标走 mipmap，不冲突。 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>agent</title>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
