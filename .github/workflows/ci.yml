# 每次 push / PR 跑一遍 `just check` + `just test`。
#
# 为什么要有：这个仓库的几条硬约束全靠「有人记得跑」——
#   - `cargo clippy -- -D warnings` 只在 `just check` 里；
#   - `Cargo.toml` 里 `panic = "abort"` 那行有个测试专门盯着（防止被无声改回去），
#     而那个测试只有跑 `cargo test` 才会执行；
#   - web 那边是 `bun test` + `svelte-check`。
# 没有 CI 的话，这些约束在「直接 cargo build」和「别人的机器上」都不生效。
#
# **刻意不在这里编 Android**：那要 NDK + SDK + Gradle 一整套（几个 GB），
# 而 Rust 侧的逻辑测试全是平台无关的（安卓专属代码都在 cfg 后面）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # 同一个分支连推几次，只跑最后一次
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      # 版本写死：`Cargo.lock` 入库了，但工具链不写死的话，
      # 新 stable 带来的新 clippy lint 会让「本来绿的提交」突然变红。
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # rustfmt 只是「格式漂没漂」，不阻断（历史代码可能没全过）
      - name: cargo fmt --check
        run: cargo fmt --check
        continue-on-error: true

      # 真正卡人的两条
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      # 中继是独立 crate（部署到服务器），也过一遍
      - name: clippy (relay)
        working-directory: relay
        run: cargo clippy --all-targets -- -D warnings

      # Android 目标只做**编译检查**（跑不了测试）：`cfg(target_os = "android")`
      # 后面的那部分（trim 的 mallopt、android_logger、uniffi 的 callback）在
      # 桌面目标上一行都不编，只有这里能发现它们坏了。
      #
      # 必须用真 NDK：`ring` / `libsqlite3-sys` 要 bionic 的头文件，
      # Debian 那个 `gcc-aarch64-linux-android` 编不过它们。
      - name: install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.0.12077973" > /dev/null

      - name: android target compiles
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          rustup target add aarch64-linux-android
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android=aarch64-linux-android26-clang
          export AR_aarch64_linux_android=llvm-ar
          cargo check --target aarch64-linux-android --lib --no-default-features

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run check

      - name: test
        run: bun test
